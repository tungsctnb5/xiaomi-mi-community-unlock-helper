name: Build Linux

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build-linux:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install native desktop dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb xauth dbus-x11 libxcb-cursor0 libxkbcommon-x11-0 \
            libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-render-util0 \
            libxcb-xinerama0 libxcb-randr0 libxcb-shape0 libxcb-sync1 \
            libxcb-xfixes0 libxcb-xkb1 libxcb-shm0 libxcb-glx0 libx11-xcb1 \
            libxrender1 libxi6 libxcomposite1 libxdamage1 libxrandr2 libxtst6 \
            libnss3 libnspr4 libdbus-1-3 libfontconfig1 libfreetype6 libgl1 \
            libegl1 libgbm1 libdrm2 libxshmfence1 libasound2 xdg-utils \
            gnome-keyring libglib2.0-bin libwayland-server0 libwayland-client0 \
            libwayland-cursor0 libwayland-egl1 libgl1-mesa-dri libglx-mesa0 mesa-utils \
            libstdc++6 libgcc-s1
      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt
      - name: Run unit tests without account data
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q --ignore=tests/test_execution_layout.py
      - name: Check native X11 layout at common display scales
        env:
          QT_QPA_PLATFORM: xcb
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: |
          layout_failed=0
          for scale in 1 1.25 1.5 2; do
            export QT_SCALE_FACTOR="$scale"
            export XIAOMI_LAYOUT_ARTIFACTS="$RUNNER_TEMP/xiaomi-layout/scale-$scale"
            xvfb-run -a -s '-screen 0 2560x2048x24' dbus-run-session -- \
              python -m pytest -q tests/test_execution_layout.py || layout_failed=1
          done
          exit "$layout_failed"
      - name: Upload Linux layout screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Linux-layout-screenshots
          path: ${{ runner.temp }}/xiaomi-layout/
          if-no-files-found: warn
      - name: Build portable Linux archive
        run: bash build-linux.sh --ci
      - name: Smoke-test extracted Linux archive
        env:
          QT_QPA_PLATFORM: xcb
          LIBGL_ALWAYS_SOFTWARE: "1"
          LIBGL_DEBUG: verbose
        run: |
          smoke_dir=$(mktemp -d)
          tar -xzf dist/Xiaomi-Mi-Community-Unlock-Helper-Linux-x64.tar.gz -C "$smoke_dir"
          app="$smoke_dir/Xiaomi Mi Community Unlock Helper/launch.sh"
          "$smoke_dir/Xiaomi Mi Community Unlock Helper/check-runtime.sh"
          timeout 20s xvfb-run -a -s '-screen 0 2560x2048x24' \
            env LD_LIBRARY_PATH="$smoke_dir/Xiaomi Mi Community Unlock Helper/_internal" glxinfo -B
          timeout 45s xvfb-run -a -s '-screen 0 2560x2048x24' dbus-run-session -- "$app" --smoke-test
          timeout 15s "$app" --check-browser-sandbox
          timeout 45s xvfb-run -a -s '-screen 0 2560x2048x24' dbus-run-session -- "$app" --webengine-smoke-test
          # A separate D-Bus session and brand-new data/runtime directories keep
          # the fake keyring roundtrip isolated from all existing credentials.
          timeout --kill-after=5s 45s xvfb-run -a dbus-run-session -- bash -euo pipefail -c '
            keyring_dir=$(mktemp -d)
            export XDG_DATA_HOME="$keyring_dir/data"
            export XDG_CONFIG_HOME="$keyring_dir/config"
            export XDG_CACHE_HOME="$keyring_dir/cache"
            export XDG_RUNTIME_DIR="$keyring_dir/runtime"
            export GNOME_KEYRING_CONTROL="$XDG_RUNTIME_DIR/keyring"
            mkdir -m 700 -p "$XDG_DATA_HOME" "$XDG_CONFIG_HOME" "$XDG_CACHE_HOME" "$XDG_RUNTIME_DIR" "$GNOME_KEYRING_CONTROL"
            printf %s ci-only-password | gnome-keyring-daemon --foreground --unlock \
              --components=secrets --control-directory="$GNOME_KEYRING_CONTROL" &
            keyring_pid=$!
            trap "kill $keyring_pid 2>/dev/null || true; wait $keyring_pid 2>/dev/null || true" EXIT
            gdbus wait --session --timeout 10 org.freedesktop.secrets
            "$1" --keyring-smoke-test
          ' bash "$app"
      - uses: actions/upload-artifact@v4
        with:
          name: Xiaomi-Mi-Community-Unlock-Helper-Linux-x64
          path: |
            dist/Xiaomi-Mi-Community-Unlock-Helper-Linux-x64.tar.gz
            dist/Xiaomi-Mi-Community-Unlock-Helper-Linux-x64.tar.gz.sha256
          if-no-files-found: error

  verify-ubuntu-24:
    needs: build-linux
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Xiaomi-Mi-Community-Unlock-Helper-Linux-x64
          path: downloaded
      - name: Install native runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb xauth dbus-x11 apparmor libxcb-cursor0 \
            libxkbcommon-x11-0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-render-util0 libxcb-xinerama0 libxcb-randr0 libxcb-shape0 \
            libxcb-sync1 libxcb-xfixes0 libxcb-xkb1 libxcb-shm0 libxcb-glx0 \
            libx11-xcb1 libxrender1 libxi6 libxcomposite1 libxdamage1 libxrandr2 \
            libxtst6 libnss3 libnspr4 libdbus-1-3 libfontconfig1 libfreetype6 \
            libgl1 libegl1 libgbm1 libdrm2 libxshmfence1 libasound2t64 xdg-utils \
            gnome-keyring libglib2.0-bin libwayland-server0 libwayland-client0 \
            libwayland-cursor0 libwayland-egl1 libgl1-mesa-dri libglx-mesa0 mesa-utils \
            libstdc++6 libgcc-s1
      - name: Smoke-test the same archive on Ubuntu 24.04
        env:
          QT_QPA_PLATFORM: xcb
          LIBGL_ALWAYS_SOFTWARE: "1"
          LIBGL_DEBUG: verbose
        run: |
          cd downloaded
          sha256sum -c Xiaomi-Mi-Community-Unlock-Helper-Linux-x64.tar.gz.sha256
          tar -xzf Xiaomi-Mi-Community-Unlock-Helper-Linux-x64.tar.gz
          app_dir="$PWD/Xiaomi Mi Community Unlock Helper"
          "$app_dir/check-runtime.sh"
          timeout 20s xvfb-run -a -s '-screen 0 2560x2048x24' \
            env LD_LIBRARY_PATH="$app_dir/_internal" glxinfo -B
          if [[ "$(sysctl -n kernel.apparmor_restrict_unprivileged_userns 2>/dev/null || true)" == 1 ]]; then
            sudo "$app_dir/enable-browser-sandbox.sh"
          fi
          timeout 45s xvfb-run -a -s '-screen 0 2560x2048x24' dbus-run-session -- "$app_dir/launch.sh" --smoke-test
          timeout 15s "$app_dir/launch.sh" --check-browser-sandbox
          timeout 45s xvfb-run -a -s '-screen 0 2560x2048x24' dbus-run-session -- "$app_dir/launch.sh" --webengine-smoke-test
          timeout --kill-after=5s 45s xvfb-run -a dbus-run-session -- bash -euo pipefail -c '
            keyring_dir=$(mktemp -d)
            export XDG_DATA_HOME="$keyring_dir/data"
            export XDG_CONFIG_HOME="$keyring_dir/config"
            export XDG_CACHE_HOME="$keyring_dir/cache"
            export XDG_RUNTIME_DIR="$keyring_dir/runtime"
            export GNOME_KEYRING_CONTROL="$XDG_RUNTIME_DIR/keyring"
            mkdir -m 700 -p "$XDG_DATA_HOME" "$XDG_CONFIG_HOME" "$XDG_CACHE_HOME" "$XDG_RUNTIME_DIR" "$GNOME_KEYRING_CONTROL"
            printf %s ci-only-password | gnome-keyring-daemon --foreground --unlock \
              --components=secrets --control-directory="$GNOME_KEYRING_CONTROL" &
            keyring_pid=$!
            trap "kill $keyring_pid 2>/dev/null || true; wait $keyring_pid 2>/dev/null || true" EXIT
            gdbus wait --session --timeout 10 org.freedesktop.secrets
            "$1" --keyring-smoke-test
          ' bash "$app_dir/launch.sh"

  upload-to-existing-release:
    needs: [build-linux, verify-ubuntu-24]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Xiaomi-Mi-Community-Unlock-Helper-Linux-x64
      - name: Add Linux files to an existing tagged release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          # The release owner creates/publishes a complete multiplatform release.
          # Never publish a Linux-only release automatically.
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" \
              Xiaomi-Mi-Community-Unlock-Helper-Linux-x64.tar.gz \
              Xiaomi-Mi-Community-Unlock-Helper-Linux-x64.tar.gz.sha256 --clobber
          else
            echo "No existing release for $GITHUB_REF_NAME; tested Linux files remain in workflow artifacts."
          fi
